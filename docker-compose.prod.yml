# Production stack on a single VPS (plan §15, option A).
#   cp .env.production.example .env.production   # fill in secrets
#   TAG=<git-sha> DOMAIN=exam.example.com docker compose -f docker-compose.prod.yml up -d
services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ['80:80', '443:443']
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web, api]

  web:
    image: ${REGISTRY:-ghcr.io/your-org}/exam-web:${TAG:-latest}
    restart: unless-stopped

  migrate:
    image: ${REGISTRY:-ghcr.io/your-org}/exam-api:${TAG:-latest}
    env_file: .env.production
    command: ['node', 'node_modules/prisma/build/index.js', 'migrate', 'deploy']
    depends_on:
      postgres: { condition: service_healthy }
    restart: 'no'

  api:
    image: ${REGISTRY:-ghcr.io/your-org}/exam-api:${TAG:-latest}
    restart: unless-stopped
    env_file: .env.production
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    deploy:
      replicas: ${API_REPLICAS:-2}

  worker:
    image: ${REGISTRY:-ghcr.io/your-org}/exam-api:${TAG:-latest}
    restart: unless-stopped
    env_file: .env.production
    command: ['node', 'dist/worker.js']
    healthcheck: { disable: true }
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: exam
      POSTGRES_USER: exam
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
    volumes: ['pg_data:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U exam -d exam']
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes: ['redis_data:/data']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 20

volumes:
  pg_data: {}
  redis_data: {}
  caddy_data: {}
  caddy_config: {}
