name: CI

# Pushes to main and v* tags run this via deploy.yml (CI must pass before images are built).
on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: Workflow Lint (actionlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint

  test:
    name: Lint, typecheck, unit + integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: exam_test
          POSTGRES_USER: exam
          POSTGRES_PASSWORD: exam
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U exam -d exam_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      # Integration tests use this fresh service DB instead of starting Testcontainers.
      TEST_DATABASE_URL: postgresql://exam:exam@localhost:5432/exam_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high
      - run: pnpm build:shared
      - run: pnpm typecheck
      - run: pnpm --filter @exam/api lint
      - name: Run API Tests with Coverage
        run: |
          set -o pipefail
          pnpm --filter @exam/api test:coverage | tee api-coverage.txt
      - name: Run Web Tests with Coverage
        run: |
          set -o pipefail
          pnpm --filter @exam/web test:coverage | tee web-coverage.txt
      - name: Publish Coverage Summaries
        if: always()
        run: |
          {
            echo "### Test Coverage - @exam/api"
            echo '```text'
            tail -n 25 api-coverage.txt
            echo '```'
            echo "### Test Coverage - @exam/web"
            echo '```text'
            tail -n 25 web-coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - run: pnpm --filter @exam/web build

  e2e:
    name: Playwright end-to-end
    needs: test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: exam
          POSTGRES_USER: exam
          POSTGRES_PASSWORD: exam
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U exam -d exam"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    env:
      DATABASE_URL: postgresql://exam:exam@localhost:5432/exam
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-access-secret-0123456789-0123456789-xx
      JWT_REFRESH_SECRET: ci-refresh-secret-0123456789-0123456789-x
      RESULT_HMAC_SECRET: ci-result-hmac-secret-0123456789-01234567
      LOG_LEVEL: warn
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm db:migrate && pnpm db:seed
      - name: Start API, worker and web
        run: |
          (cd apps/api && node dist/main.js > ../../api.log 2>&1 &)
          (cd apps/api && node dist/worker.js > ../../worker.log 2>&1 &)
          (cd apps/web && npx vite preview --port 5173 --strictPort > ../../web.log 2>&1 &)
          npx wait-on -t 60000 http://localhost:4000/api/health http://localhost:5173
      - run: npx playwright install --with-deps chromium
      - run: pnpm test:e2e
      - if: failure()
        run: tail -n 200 api.log worker.log web.log
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report

  docker-build:
    name: Build Docker Images
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API Image
        run: docker build -f apps/api/Dockerfile -t exam-api:${{ github.sha }} .
      - name: Build Web Image
        run: docker build -f apps/web/Dockerfile -t exam-web:${{ github.sha }} .

