name: Build & deploy

# main  → CI → build images, push to GHCR → deploy to staging
# v*    → CI → images → production (requires approval on the "production" environment)
# The SSH deploy step runs only when the repository variable DEPLOY_ENABLED is "true"
# and the DEPLOY_HOST / DEPLOY_USER / DEPLOY_SSH_KEY secrets are set.
on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  images:
    needs: ci
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/exam-${{ matrix.app }}:${{ github.sha }}
            ${{ env.REGISTRY }}/exam-${{ matrix.app }}:${{ github.ref_type == 'tag' && github.ref_name || 'main' }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  deploy:
    needs: images
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: ${{ github.ref_type == 'tag' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v4
      - name: Upload compose files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: docker-compose.prod.yml,Caddyfile,scripts/deploy.sh
          target: /opt/exam
      - name: Roll out (automatic rollback on failed health check)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/exam
            REGISTRY=${{ env.REGISTRY }} DOMAIN=${{ vars.DOMAIN }} sh scripts/deploy.sh ${{ github.sha }}
