packages:
  - apps/*
  - packages/*

# pnpm >= 11: explicit allow-list for dependency install scripts.
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  prisma: true
  esbuild: true
  '@scarf/scarf': false
  cpu-features: false
  msgpackr-extract: false
  protobufjs: false
  ssh2: false
